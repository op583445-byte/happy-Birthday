<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>
<style>
*{box-sizing:border-box}
/* html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dcecff} */

html,body{margin:0;width:100%;height:100%;overflow:hidden;background:linear-gradient(180deg,#f8dce5 0%,#e8c8d5 50%,#c9d8ee 100%)}
.page{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
.postcard{position:relative;width:min(100vw,calc(100vh * 1.777896));aspect-ratio:1672/941;background:url("page-1-clean2.png") center/contain no-repeat;overflow:visible}
.yes{position:absolute;left:54.8%;top:68%;width:8.2%;height:6%;border:0;background:transparent;cursor:pointer;z-index:5;-webkit-tap-highlight-color:transparent}
.no-button{position:absolute;left:68.6%;top:69.4%;width:5%;height:4.4%;border:0;padding:0;margin:0;background:url("No-button1.png") center/contain no-repeat;cursor:pointer;z-index:10;transition:left .18s ease,top .18s ease;-webkit-tap-highlight-color:transparent}
#noButton { position: absolute;
    filter:
    drop-shadow(0 0 6px rgba(255, 80, 120, 0.7))
    drop-shadow(0 0 18px rgba(255, 60, 110, 0.5));
animation: noGlow 1.5s ease-in-out infinite alternate;
}


@keyframes noGlow {
    from {
        filter: drop-shadow(0 0 7px rgba(80, 217, 255, 0.818));
    }

    to {
        filter:
            drop-shadow(0 0 5px rgba(80, 173, 255, 0.985))
            drop-shadow(0 0 8px rgba(50, 67, 255, 0.851));
    }
}

.no-button:focus,.yes:focus{outline:none}

@media(max-width:600px){
 .postcard{width:100vw}
 .yes{left:54%;top:67.5%;width:10%;height:7%}
 .no-button{left:68%;top:68%;width:9%;height:7%}
}
</style>
</head>
<body>
<main class="page">
<div class="postcard" aria-label="Birthday postcard">
<a class="yes" href="page2.html" aria-label="Yes"></a>
<button class="no-button" id="noButton" type="button" aria-label="No"></button>
</div>
</main>
<script>
const noButton=document.getElementById('noButton');
const postcard=document.querySelector('.postcard');
function moveNoButton(event){
 if(event) event.preventDefault();
 const r=postcard.getBoundingClientRect(), b=noButton.getBoundingClientRect();
 const px=r.width*.035, py=r.height*.035;
 const maxLeft=r.width-b.width-px, maxTop=r.height-b.height-py;
 const left=px+Math.random()*Math.max(0,maxLeft-px);
 const top=py+Math.random()*Math.max(0,maxTop-py);
 noButton.style.left=(left/r.width*100)+'%';
 noButton.style.top=(top/r.height*100)+'%';
}
noButton.addEventListener('mouseenter',moveNoButton);
noButton.addEventListener('touchstart',moveNoButton,{passive:false});
noButton.addEventListener('click',moveNoButton);
</script>
</body>
</html>
